services:
  postgres:
    image: 'postgres:17.7'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=bot_db'
      - 'POSTGRES_USER=myuser'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-secret}'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d bot_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: 'redis:7.4-alpine'
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret} --appendonly yes
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  bot-server:
    build:
      context: .
      dockerfile: telegram-bot-starter-runner/Dockerfile
#    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bot_db
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-secret}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
      - BOT_TOKEN=${BOT_TOKEN:-123456789:AAFakeTokenForTestingStarterPurposes00}
      - SERVER_URL=${SERVER_URL:-http://localhost:8080}
      - TINKOFF_TERMINAL_KEY=${TINKOFF_TERMINAL_KEY:-}
      - TINKOFF_PASSWORD=${TINKOFF_PASSWORD:-}
      - DEBUG_TINKOFF_TERMINAL_KEY=${DEBUG_TINKOFF_TERMINAL_KEY:-}
      - DEBUG_TINKOFF_PASSWORD=${DEBUG_TINKOFF_PASSWORD:-}
      - DEBUG_TINKOFF_MODE=${DEBUG_TINKOFF_MODE:-0}
      - DEBUG_MODE=${DEBUG_MODE:-0}

volumes:
  postgres_data:
  redis_data:
