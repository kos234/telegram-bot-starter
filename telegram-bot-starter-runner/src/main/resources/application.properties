# ===================================================================
# Общие настройки приложения (Spring Boot)
# ===================================================================
spring.application.name=telegram-bot-starter-runner
spring.threads.virtual.enabled=true

# ===================================================================
# Настройки базы данных PostgreSQL (JPA)
# Внутри Docker: jdbc:postgresql://postgres:5432/bot_db
# Локально на хосте: jdbc:postgresql://localhost:5434/bot_db
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/bot_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:secret}}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# Автоматическое создание/обновление таблиц JPA (UserInfo, Admin, State, History, TinkoffPayments)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Настройки Redis (State / History / Cache)
# Внутри Docker: хост redis, порт 6379
# Локально на хосте: хост localhost, порт 6379
# ===================================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:secret}}

# ===================================================================
# ПАРАМЕТРЫ СТАРТЕРА: telegram-bot-spring-boot-starter (prefix: telegram.bot)
# Все доступные параметры включены и настроены ниже:
# ===================================================================

# 1. Токен Telegram бота (поддерживается fallback из bot.token, bot_token или переменной окружения BOT_TOKEN)
telegram.bot.token=${BOT_TOKEN:123456789:AAFakeTokenForTestingStarterPurposes00}

# 2. Хранилище FSM состояний и истории переходов (navigation history):
# Доступные варианты: redis (по умолчанию), memory, jpa
telegram.bot.state-storage=redis

# 3. Хранилище профилей пользователей (UserInfo):
# Доступные варианты: jpa (по умолчанию), memory, redis
telegram.bot.user-storage=jpa

# 4. Хранилище списка администраторов (Admins):
# Доступные варианты: jpa (по умолчанию), memory
telegram.bot.admin-storage=jpa

# 5. Настройки поддержки языков и локализации:
# Включение поддержки выбора языка пользователем
telegram.bot.language.enabled=true
# Язык по умолчанию (RU, EN или добавленный кастомный)
telegram.bot.language.default-code=RU
# Регистрация дополнительных языков через конфигурацию
telegram.bot.language.custom[0].id=3
telegram.bot.language.custom[0].code=KZ
telegram.bot.language.custom[0].tag=kk
# \u049A\u0430\u0437\u0430\u049B\u0448\u0430 = Қазақша
telegram.bot.language.custom[0].title=\u049A\u0430\u0437\u0430\u049B\u0448\u0430

# 6. Настройки поддержки валют:
# Включение поддержки валют и их выбора пользователем
telegram.bot.currency.enabled=true
# Валюта по умолчанию (RUB, USD или добавленная кастомная)
telegram.bot.currency.default-code=RUB
# Регистрация дополнительных валют через конфигурацию
telegram.bot.currency.custom[0].id=3
telegram.bot.currency.custom[0].code=KZT
# \u0422\u0435\u043D\u0433\u0435 = Тенге
telegram.bot.currency.custom[0].title=\u0422\u0435\u043D\u0433\u0435

# 7. Настройки поддержки Email:
# Включение отображения и редактирования email в меню настроек
telegram.bot.email.enabled=true

# 8. Настройки поддержки телефона:
# Включение отображения и редактирования телефона в меню настроек
telegram.bot.phone.enabled=true

# ===================================================================
# ПАРАМЕТРЫ СТАРТЕРА: telegram-bot-payment-tinkoff-spring-boot-starter (prefix: bot.payment.tinkoff)
# ===================================================================
# Включение модуля оплаты Т-Банк
bot.payment.tinkoff.enabled=true
# Внешний URL сервера для приема webhook уведомлений от Т-Банка
bot.payment.tinkoff.server-url=${SERVER_URL:http://localhost:8080}
# Терминал и пароль
bot.payment.tinkoff.terminal-key=${TINKOFF_TERMINAL_KEY:}
bot.payment.tinkoff.password=${TINKOFF_PASSWORD:}
# Настройки отладочного режима
bot.payment.tinkoff.debug-terminal-key=${DEBUG_TINKOFF_TERMINAL_KEY:}
bot.payment.tinkoff.debug-password=${DEBUG_TINKOFF_PASSWORD:}
bot.payment.tinkoff.debug-mode=${DEBUG_MODE:0}
bot.payment.tinkoff.debug-tinkoff-mode=${DEBUG_TINKOFF_MODE:0}
# Хранилище платежей Т-Банк: jpa, memory, redis
bot.payment.tinkoff.storage=jpa

# ===================================================================
# Порт встроенного веб-сервера (Tomcat)
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# Логирование
# ===================================================================
logging.level.root=INFO
logging.level.kos.progs=DEBUG
